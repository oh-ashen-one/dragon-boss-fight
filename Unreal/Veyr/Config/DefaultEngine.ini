[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/VeyrArena
GameDefaultMap=/Game/Maps/VeyrArena
GlobalDefaultGameMode=/Script/Veyr.VeyrGameMode

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
; Phase C (2026-11-18): exposure and motion blur are turned on by the court's
; post-process in the new look, so -VeyrLegacyRender keeps build 16's defaults.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; Lumen software ray tracing (global distance field), Lumen reflections and
; virtual shadow maps, as the reference project. Distance fields are a cook-time
; (read-only) setting; the GI/reflection/VSM methods are switched back at runtime
; by -VeyrLegacyRender (VeyrLook.cpp).
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=0
r.Shadow.Virtual.Enable=1
r.SkinCache.CompileShaders=1

[HTTPServer.Listeners]
DefaultBindAddress=127.0.0.1

[/Script/Engine.Engine]
bSmoothFrameRate=False

[ConsoleVariables]
; The visible Dragon explicitly opts into Skin Cache before renderer creation.
; Other meshes keep the ordinary path; the hidden attack probe is CPU-pose-only.
; Preserve all authored morphs while avoiding UE5.8's failing inline morph
; double-buffer route. These startup settings require a fresh shader cook.
r.SkinCache.Allow=1
r.SkinCache.Mode=1
r.SkinCache.DefaultBehavior=0
r.SkinCache.AsyncCompute=0
